<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – Health Tech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-custom">
    <div class="container justify-content-between">
      <a class="brand-logo" href="index.html">
        <div class="logo-icon"><i class="bi bi-heart-pulse-fill"></i></div>
        <span>Health<span class="highlight">Tech</span></span>
      </a>
      <a href="login.html" class="small fw-semibold text-primary">Already registered? Sign in</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 620px;">
      <div class="text-center mb-4">
        <div class="logo-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
          <i class="bi bi-person-plus-fill"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Create Patient Account</h3>
        <p class="text-muted small">Join Health Tech for digital health records & intelligent monitoring</p>
      </div>

      <div id="registerAlertBox" class="alert alert-danger d-none py-2 small mb-3"></div>

      <form id="registerForm">
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-bold text-dark">Full Name *</label>
            <input type="text" id="regName" class="form-control form-control-ht" placeholder="Jane Doe" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold text-dark">Email Address *</label>
            <input type="email" id="regEmail" class="form-control form-control-ht" placeholder="jane@example.com" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-bold text-dark">Password *</label>
            <input type="password" id="regPassword" class="form-control form-control-ht" placeholder="At least 6 characters" minlength="6" required>
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold text-dark">Age</label>
            <input type="number" id="regAge" class="form-control form-control-ht" placeholder="35" min="0" max="120">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold text-dark">Gender</label>
            <select id="regGender" class="form-select form-control-ht">
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Other">Other</option>
              <option value="Prefer not to say">Unspecified</option>
            </select>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-bold text-dark">Contact Phone</label>
            <input type="tel" id="regPhone" class="form-control form-control-ht" placeholder="+1 (555) 000-0000">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold text-dark">Blood Group</label>
            <select id="regBloodGroup" class="form-select form-control-ht">
              <option value="O+">O Positive (O+)</option>
              <option value="O-">O Negative (O-)</option>
              <option value="A+">A Positive (A+)</option>
              <option value="A-">A Negative (A-)</option>
              <option value="B+">B Positive (B+)</option>
              <option value="B-">B Negative (B-)</option>
              <option value="AB+">AB Positive (AB+)</option>
              <option value="AB-">AB Negative (AB-)</option>
              <option value="Unknown" selected>Unknown / Unchecked</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold text-dark">Known Allergies (Optional)</label>
          <input type="text" id="regAllergies" class="form-control form-control-ht" placeholder="e.g. Penicillin, Peanuts, Sulfa (comma separated)">
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold text-dark">Existing Medical Conditions (Optional)</label>
          <input type="text" id="regConditions" class="form-control form-control-ht" placeholder="e.g. Hypertension, Asthma, Diabetes (comma separated)">
        </div>

        <!-- Account Role & Admin Secret -->
        <div class="p-3 bg-light rounded-3 border mb-4">
          <div class="row g-2 align-items-center">
            <div class="col-md-6">
              <label class="form-label small fw-bold text-dark mb-1">Account Role</label>
              <select id="regRole" class="form-select form-select-sm">
                <option value="patient" selected>Patient (Standard)</option>
                <option value="admin">System Administrator</option>
              </select>
            </div>
            <div class="col-md-6" id="adminSecretContainer" style="display: none;">
              <label class="form-label small fw-bold text-dark mb-1">Admin Security Key</label>
              <input type="password" id="regAdminSecret" class="form-control form-control-sm" placeholder="HEALTH_TECH_ADMIN_2026">
            </div>
          </div>
        </div>

        <button type="submit" id="btnRegisterSubmit" class="btn btn-primary-ht w-100 py-2 mb-3">
          <i class="bi bi-check-circle me-2"></i>Create Account
        </button>

        <div class="text-center small text-muted">
          Already registered? <a href="login.html" class="fw-semibold">Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfAuth();

    // Toggle admin secret input
    document.getElementById('regRole').addEventListener('change', (e) => {
      const adminContainer = document.getElementById('adminSecretContainer');
      if (e.target.value === 'admin') {
        adminContainer.style.display = 'block';
        document.getElementById('regAdminSecret').value = 'HEALTH_TECH_ADMIN_2026';
      } else {
        adminContainer.style.display = 'none';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('registerAlertBox');
      alertBox.classList.add('d-none');

      const submitBtn = document.getElementById('btnRegisterSubmit');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

      const allergiesVal = document.getElementById('regAllergies').value;
      const conditionsVal = document.getElementById('regConditions').value;

      const payload = {
        name: document.getElementById('regName').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value,
        age: document.getElementById('regAge').value ? Number(document.getElementById('regAge').value) : undefined,
        gender: document.getElementById('regGender').value,
        phone: document.getElementById('regPhone').value.trim(),
        bloodGroup: document.getElementById('regBloodGroup').value,
        allergies: allergiesVal ? allergiesVal.split(',').map((s) => s.trim()).filter(Boolean) : [],
        chronicConditions: conditionsVal ? conditionsVal.split(',').map((s) => s.trim()).filter(Boolean) : [],
        role: document.getElementById('regRole').value,
        adminSecret: document.getElementById('regAdminSecret') ? document.getElementById('regAdminSecret').value : ''
      };

      try {
        const res = await apiRequest('/auth/register', {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        setSession(res.token, res.user);
        showToast('Account created successfully!', 'success');

        setTimeout(() => {
          if (res.user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 500);
      } catch (err) {
        alertBox.textContent = err.message || 'Registration failed.';
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Create Account';
      }
    });
  </script>
</body>
</html>
