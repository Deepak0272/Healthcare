<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – Health Tech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-custom">
    <div class="container justify-content-between">
      <a class="brand-logo" href="index.html">
        <div class="logo-icon"><i class="bi bi-heart-pulse-fill"></i></div>
        <span>Health<span class="highlight">Tech</span></span>
      </a>
      <a href="register.html" class="small fw-semibold text-primary">Need an account? Sign up</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="logo-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
          <i class="bi bi-lock-fill"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
        <p class="text-muted small">Sign in to your secure healthcare portal</p>
      </div>

      <div id="loginAlertBox" class="alert alert-danger d-none py-2 small mb-3"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label small fw-bold text-dark">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" id="loginEmail" class="form-control form-control-ht border-start-0" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label small fw-bold text-dark">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
            <input type="password" id="loginPassword" class="form-control form-control-ht border-start-0" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn btn-primary-ht w-100 py-2 mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <!-- Demo Accounts Quick Fill Buttons -->
      <div class="p-3 bg-light rounded-3 border mb-3">
        <div class="small fw-bold text-muted text-uppercase mb-2 text-center" style="letter-spacing: 0.5px;">Quick Demo Accounts</div>
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-sm btn-outline-primary" id="btnFillPatient">
            <i class="bi bi-person-fill me-1"></i>Fill Demo Patient (John Doe)
          </button>
          <button type="button" class="btn btn-sm btn-outline-dark" id="btnFillAdmin">
            <i class="bi bi-shield-lock-fill me-1"></i>Fill Demo Administrator
          </button>
        </div>
      </div>

      <div class="text-center small text-muted">
        Don't have an account? <a href="register.html" class="fw-semibold">Register here</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfAuth();

    // Check if session expired
    if (window.location.search.includes('expired=1')) {
      const alertBox = document.getElementById('loginAlertBox');
      alertBox.textContent = 'Your session has expired. Please log in again.';
      alertBox.classList.remove('d-none');
    }

    // Demo Fill handlers
    document.getElementById('btnFillPatient').addEventListener('click', () => {
      document.getElementById('loginEmail').value = 'patient@healthtech.com';
      document.getElementById('loginPassword').value = 'Patient@12345';
    });

    document.getElementById('btnFillAdmin').addEventListener('click', () => {
      document.getElementById('loginEmail').value = 'admin@healthtech.com';
      document.getElementById('loginPassword').value = 'Admin@12345';
    });

    // Form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('loginAlertBox');
      alertBox.classList.add('d-none');

      const submitBtn = document.getElementById('btnLoginSubmit');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        setSession(res.token, res.user);
        showToast('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          if (res.user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 500);
      } catch (err) {
        alertBox.textContent = err.message || 'Login failed. Please verify credentials.';
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
      }
    });
  </script>
</body>
</html>
